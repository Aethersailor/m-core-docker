name: Sync mihomo images

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Upstream channel
        type: choice
        options: [both, release, alpha]
        default: both
      force:
        description: Rebuild even when upstream is unchanged
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        channel: [release, alpha]
    concurrency:
      group: publish-${{ matrix.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set image names
        id: config
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REQUESTED_CHANNEL: ${{ inputs.channel || 'both' }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          if [[ "$REQUESTED_CHANNEL" != both && "$REQUESTED_CHANNEL" != "$CHANNEL" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN" || {
            echo '::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets.'
            exit 1
          }
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=docker.io/${DOCKERHUB_USERNAME,,}/mihomo-docker" >> "$GITHUB_ENV"
      - name: Login to GHCR
        if: steps.config.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: steps.config.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup QEMU
        if: steps.config.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm,arm64
      - name: Setup Buildx
        if: steps.config.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sync and verify all platforms in both registries
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_SYNC: ${{ inputs.force || 'false' }}
          CHANNEL: ${{ matrix.channel }}
        run: python3 scripts/sync.py --channel "$CHANNEL"
