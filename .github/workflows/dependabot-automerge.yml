name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Sync mihomo images]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/dependabot-automerge.yml
      - scripts/dependabot_queue.py
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Merge Dependabot updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependabot_queue.py
